name: upstream-postmerge-ci

# The full Codex Rust/Bazel/V8 postmerge matrix is retained in the imported
# workflow files for provenance, but it relies on OpenAI-owned runners, caches,
# and release credentials. It is manual-only in this independent downstream.
# Normal pushes and pull requests are covered by blocking-ci.yml.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  provenance-note:
    name: Explain the downstream boundary
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "WeaveCodex validates weave-control-plane/ in blocking-ci."
          echo "Run upstream Codex CI in openai/codex or a compatible infrastructure fork."
