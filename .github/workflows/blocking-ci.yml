name: blocking-ci

# WeaveCodex carries a pinned copy of the upstream Codex tree, but this
# downstream repository develops and releases only weave-control-plane/. The
# upstream multi-platform Rust/Bazel release matrix depends on OpenAI-owned
# infrastructure and is intentionally not the merge gate here.
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: weave-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Weave control plane
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: weave-control-plane
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: weave-control-plane/uv.lock

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install the locked development environment
        run: uv sync --frozen

      - name: Lint Python
        run: uv run ruff check .

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Run control-plane tests
        run: uv run pytest

      - name: Parse browser JavaScript
        run: |
          node --check weave_codex/static/app.js
          node --check weave_codex/static/compare.js
          node --check weave_codex/static/deep-dive.js

      - name: Check the public release surface
        run: uv run python scripts/check_public_release.py

      - name: Require a clean generated state
        run: git -C .. diff --exit-code --check

  required:
    name: CI required
    if: ${{ always() }}
    needs: [control-plane]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful control-plane checks
        env:
          RESULT: ${{ needs.control-plane.result }}
        run: test "$RESULT" = success
