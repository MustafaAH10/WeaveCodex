  <title id="poster-title">Night Bloom — 17 October at Riverside Makers Hall</title>
  <desc id="poster-description">A quiet editorial poster for Night Bloom on 17 October at Riverside Makers Hall. Free entry. Moon-coloured typography sits on an ink background, framed by an abstract botanical arrangement of orchid-purple petals and leaf-green stems.</desc>

  <rect width="1200" height="1600" fill="#101828"/>

